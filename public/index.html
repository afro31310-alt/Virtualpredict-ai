<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SportyPredict AI</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #020611;
  color: white;
}

.container {
  width: 100%;
  max-width: 720px;
  margin: auto;
  padding: 18px;
}

.header {
  text-align: center;
  padding: 28px 10px;
}

.logo {
  font-size: 42px;
}

.header h1 {
  margin: 5px 0;
  font-size: 32px;
}

.header p {
  color: #9da8bc;
  font-size: 16px;
  line-height: 1.5;
}

.card {
  background: #070d1b;
  border: 1px solid #263149;
  border-radius: 20px;
  padding: 20px;
  margin-bottom: 18px;
}

.section-title {
  font-size: 21px;
  font-weight: bold;
  margin-bottom: 18px;
}

.input-label {
  display: block;
  color: #aeb7c7;
  font-size: 14px;
  margin-bottom: 8px;
}

.phone-input {
  width: 100%;
  padding: 15px;
  border-radius: 11px;
  border: 1px solid #39445d;
  background: #101827;
  color: white;
  font-size: 16px;
  outline: none;
}

.phone-input:focus {
  border-color: #00b978;
}

.phone-note {
  color: #707c91;
  font-size: 12px;
  line-height: 1.5;
  margin-top: 8px;
}

.upload-area {
  border: 2px dashed #46536e;
  border-radius: 17px;
  padding: 25px 15px;
  text-align: center;
}

.upload-icon {
  font-size: 45px;
}

.upload-area h2 {
  margin: 8px 0;
}

.upload-area p {
  color: #aeb7c7;
  line-height: 1.5;
}

.buttons {
  display: flex;
  gap: 10px;
  justify-content: center;
  flex-wrap: wrap;
  margin-top: 20px;
}

.upload-button {
  display: inline-block;
  background: #27324d;
  color: white;
  border-radius: 11px;
  padding: 14px 20px;
  font-weight: bold;
  cursor: pointer;
}

.upload-button:active {
  transform: scale(0.97);
}

input[type="file"] {
  position: absolute;
  width: 1px;
  height: 1px;
  opacity: 0;
}

#selectedText {
  display: none;
  color: #00d084;
  font-weight: bold;
  margin-top: 15px;
}

#preview {
  display: none;
  width: 100%;
  max-height: 450px;
  object-fit: contain;
  border-radius: 14px;
  margin-top: 18px;
  background: #02050b;
  border: 1px solid #39445d;
}

.analyze-button {
  display: none;
  width: 100%;
  margin-top: 18px;
  padding: 16px;
  border: none;
  border-radius: 12px;
  background: #00a86b;
  color: white;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
}

.analyze-button:disabled {
  opacity: 0.55;
}

.status {
  text-align: center;
  margin-top: 15px;
  color: #aeb7c7;
  min-height: 22px;
}

.error {
  color: #ff7777;
  text-align: center;
  margin-top: 12px;
}

#results {
  display: none;
}

.results-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  margin-bottom: 15px;
}

.match-count {
  background: #123b2c;
  color: #00d084;
  padding: 8px 11px;
  border-radius: 20px;
  font-size: 12px;
  font-weight: bold;
}

.match-card {
  background: #0d1422;
  border: 1px solid #29354c;
  border-radius: 16px;
  padding: 17px;
  margin-bottom: 15px;
}

.match-number {
  color: #77849b;
  font-size: 12px;
  font-weight: bold;
  margin-bottom: 8px;
}

.match-title {
  font-size: 21px;
  font-weight: bold;
  margin-bottom: 15px;
}

.info {
  background: #151d2c;
  border-radius: 10px;
  padding: 11px;
  margin-top: 8px;
}

.info-label {
  color: #8995aa;
  font-size: 12px;
  margin-bottom: 5px;
}

.info-value {
  font-size: 16px;
  font-weight: bold;
}

.prediction {
  background: #08271d;
  border: 1px solid #00a86b;
}

.prediction .info-label {
  color: #55d9a9;
}

.confidence {
  display: inline-block;
  margin-top: 10px;
  background: #263149;
  border-radius: 8px;
  padding: 7px 10px;
  font-size: 13px;
}

.warning {
  margin-top: 20px;
  padding: 13px;
  border-radius: 10px;
  background: #211b0b;
  color: #ffd36a;
  font-size: 13px;
  line-height: 1.5;
}

.footer {
  text-align: center;
  color: #667085;
  font-size: 12px;
  padding: 25px 0;
}
</style>
</
