<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>VirtualPredict AI</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #050505;
  color: white;
}

.container {
  width: 94%;
  max-width: 700px;
  margin: auto;
  padding: 25px 0 50px;
}

h1 {
  text-align: center;
  color: #ff1515;
  margin-bottom: 8px;
}

.subtitle {
  text-align: center;
  color: #ccc;
  margin-bottom: 25px;
}

.upload-box {
  border: 2px dashed #7a2222;
  border-radius: 18px;
  padding: 25px 18px;
  background: #100707;
}

.upload-text {
  text-align: center;
  color: #ccc;
  margin-bottom: 20px;
}

/* ACCOUNT NUMBER */

.account-box {
  margin-bottom: 22px;
}

.account-label {
  display: block;
  color: white;
  font-weight: bold;
  margin-bottom: 8px;
}

.account-input {
  width: 100%;
  padding: 15px;
  border-radius: 12px;
  border: 1px solid #8b0000;
  background: #080808;
  color: white;
  font-size: 17px;
  outline: none;
}

.account-input:focus {
  border-color: #ff1515;
}

.account-note {
  color: #999;
  font-size: 12px;
  margin-top: 7px;
}

/* BUTTONS */

.buttons {
  display: flex;
  gap: 15px;
  justify-content: center;
  flex-wrap: wrap;
}

.upload-btn {
  display: inline-block;
  background: #e60000;
  color: white;
  padding: 15px 35px;
  border-radius: 14px;
  font-size: 18px;
  font-weight: bold;
  cursor: pointer;
  text-align: center;
}

.upload-btn:active {
  transform: scale(.97);
}

input[type="file"] {
  display: none;
}

.selected {
  text-align: center;
  color: #00ff88;
  font-weight: bold;
  font-size: 18px;
  margin: 25px 0 15px;
  display: none;
}

.preview {
  display: none;
  width: 100%;
  max-height: 600px;
  object-fit: contain;
  border-radius: 15px;
  border: 1px solid #8b0000;
  background: black;
  margin-bottom: 20px;
}

.analyze {
  width: 100%;
  border: none;
  border-radius: 15px;
  padding: 18px;
  background: #ff0808;
  color: white;
  font-size: 21px;
  font-weight: bold;
  cursor: pointer;
}

.analyze:disabled {
  background: #555;
  cursor: not-allowed;
}

.error {
  color: #ff5555;
  text-align: center;
  font-weight: bold;
  margin-top: 20px;
}

.loading {
  text-align: center;
  color: #ff4444;
  font-size: 18px;
  margin: 20px 0;
  display: none;
}

.results {
  margin-top: 25px;
}

.match {
  background: #110808;
  border: 1px solid #8b0000;
  border-radius: 16px;
  padding: 18px;
  margin-bottom: 18px;
}

.match-number {
  color: #ff3333;
  font-weight: bold;
  margin-bottom: 8px;
}

.game {
  font-size: 21px;
  font-weight: bold;
  margin-bottom: 15px;
}

.row {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  padding: 10px 0;
  border-bottom: 1px solid #321010;
}

.label {
  color: #aaa;
}

.value {
  font-weight: bold;
  text-align: right;
}

.prediction {
  margin-top: 15px;
  padding: 15px;
  border-radius: 12px;
  background: #260606;
  border: 1px solid #e60000;
}

.prediction-title {
  color: #ff3333;
  font-weight: bold;
  margin-bottom: 8px;
}

.analysis {
  margin-top: 15px;
  color: #ccc;
  line-height: 1.5;
  font-size: 14px;
}
</style>
</head>

<body>

<div class="container">

  <h1>⚡ VirtualPredict AI</h1>

  <div class="subtitle">
    1X2 Virtual Game Analysis
  </div>

  <div class="upload-box">

    <!-- ACCOUNT NUMBER -->

    <div class="account-box">

      <label class="account-label" for="accountNumber">
        📱 SportyBet Account Number
      </label>

      <input
        id="accountNumber"
        class="account-input"
        type="tel"
        inputmode="numeric"
        placeholder="Enter your account number"
        autocomplete="off"
      >

      <div class="account-note">
        Your account number is not sent to the AI.
        Never enter your password or PIN.
      </div>

    </div>

    <div class="upload-text">
      Select a screenshot containing the virtual games.
    </div>

    <!-- UPLOAD BUTTONS -->

    <div class="buttons">

      <label class="upload-btn" for="gallery">
        🖼️ Gallery
      </label>

      <input
        id="gallery"
        type="file"
        accept="image/*"
      >

      <label class="upload-btn" for="camera">
        📷 Camera
      </label>

      <input
        id="camera"
        type="file"
        accept="image/*"
        capture="environment"
      >

    </div>

    <!-- SELECTED -->

    <div id="selected" class="selected">
      ✅ Screenshot selected
    </div>

    <!-- PREVIEW -->

    <img
      id="preview"
      class="preview"
      alt="Screenshot preview"
    >

    <!-- ANALYZE -->

    <button
      id="analyze"
      class="analyze"
      disabled
    >
      🔍 Analyze All Games
    </button>

    <div id="loading" class="loading">
      🔄 Analyzing all readable games...
    </div>

    <div id="error" class="error"></div>

  </div>

  <!-- RESULTS -->

  <div id="results" class="results"></div>

</div>

<script>

const gallery =
  document.getElementById("gallery");

const camera =
  document.getElementById("camera");

const preview =
  document.getElementById("preview");

const selected =
  document.getElementById("selected");

const analyze =
  document.getElementById("analyze");

const loading =
  document.getElementById("loading");

const errorBox =
  document.getElementById("error");

const results =
  document.getElementById("results");

const accountNumber =
  document.getElementById("accountNumber");

let selectedFile = null;


/* =========================
   SAVE ACCOUNT NUMBER
   LOCALLY ONLY
========================= */

accountNumber.addEventListener(
  "input",
  function() {

    localStorage.setItem(
      "sportybetAccountNumber",
      this.value
    );

  }
);


/* =========================
   LOAD SAVED NUMBER
========================= */

const savedNumber =
  localStorage.getItem(
    "sportybetAccountNumber"
  );

if (savedNumber) {
  accountNumber.value = savedNumber;
}


/* =========================
   FILE SELECTION
========================= */

function chooseFile(file) {

  if (!file) return;

  selectedFile = file;

  const reader =
    new FileReader();

  reader.onload =
    function(e) {

      preview.src =
        e.target.result;

      preview.style.display =
        "block";

      selected.style.display =
        "block";

      analyze.disabled =
        false;

      errorBox.textContent =
        "";

      results.innerHTML =
        "";

    };

  reader.readAsDataURL(file);
}


/* =========================
   GALLERY
========================= */

gallery.addEventListener(
  "change",
  function() {

    chooseFile(
      this.files[0]
    );

  }
);


/* =========================
   CAMERA
========================= */

camera.addEventListener(
  "change",
  function() {

    chooseFile(
      this.files[0]
    );

  }
);


/* =========================
   ANALYZE
========================= */

analyze.addEventListener
