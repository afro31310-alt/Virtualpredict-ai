<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#080d18">
<title>VirtualPredict AI</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#080d18;
  color:#fff;
  min-height:100vh
}

.container{
  max-width:680px;
  margin:auto;
  padding:20px
}

h1{
  margin:8px 0 6px;
  font-size:30px
}

.sub{
  color:#aeb8cc;
  margin:0 0 22px;
  line-height:1.5
}

.card{
  background:#111827;
  border:1px solid #263149;
  border-radius:18px;
  padding:18px;
  margin-bottom:16px
}

.upload-box{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  min-height:180px;
  border:2px dashed #53617c;
  border-radius:16px;
  background:#0c1322;
  text-align:center;
  padding:22px;
  cursor:pointer
}

.icon{
  font-size:44px;
  margin-bottom:10px
}

.upload-title{
  font-size:18px;
  font-weight:700
}

.upload-help{
  color:#9da8bc;
  font-size:14px;
  margin-top:7px
}

.actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:12px
}

.action{
  border:0;
  border-radius:12px;
  padding:14px 10px;
  font-size:15px;
  font-weight:700;
  cursor:pointer;
  text-align:center
}

.camera{
  background:#2563eb;
  color:#fff
}

.gallery{
  background:#263149;
  color:#fff
}

.analyze{
  width:100%;
  margin-top:14px;
  border:0;
  border-radius:12px;
  padding:15px;
  background:#16a34a;
  color:#fff;
  font-size:17px;
  font-weight:700;
  cursor:pointer
}
