<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>VirtualPredict AI</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #090000, #260000, #090000);
      color: white;
      min-height: 100vh;
    }

    .container {
      width: 94%;
      max-width: 700px;
      margin: auto;
      padding: 45px 0;
    }

    h1 {
      text-align: center;
      color: #ff1515;
      font-size: 42px;
      margin: 15px 0;
    }

    .subtitle {
      text-align: center;
      color: #ddd;
      font-size: 20px;
      margin-bottom: 45px;
    }

    .box {
      background: rgba(15, 0, 0, 0.92);
      border: 2px solid #a90000;
      border-radius: 30px;
      padding: 28px;
      box-shadow: 0 0 25px rgba(255, 0, 0, 0.18);
    }

    label.title {
      display: block;
      font-size: 21px;
      font-weight: bold;
      margin-bottom: 12px;
    }

    #account {
      width: 100%;
      padding: 17px;
      border-radius: 22px;
      border: 2px solid #500000;
      background: #050505;
      color: white;
      font-size: 20px;
      outline: none;
      margin-bottom: 10px;
    }

    .note {
      color: #888;
      font-size: 15px;
      line-height: 1.4;
      margin-bottom: 25px;
    }

    .buttons {
      display: flex;
      gap: 20px;
      margin-bottom: 18px;
    }

    .upload-btn {
      flex: 1;
      background: #ed0000;
      color: white;
      border: none;
      border-radius: 22px;
      padding: 20px 10px;
      font-size: 20px;
      font-weight: bold;
      text-align: center;
      cursor: pointer;
      display: block;
    }

    .upload-btn:active {
      transform: scale(0.97);
    }

    /*
      The file inputs are kept in the page but visually hidden.
      The buttons above trigger them.
    */
    .file-input {
      position: fixed;
      left: -10000px;
      top: -10000px;
      width: 1px;
      height: 1px;
      opacity: 0;
    }

    #previewBox {
      display: none;
      margin-top: 20px;
      text-align: center;
    }
