<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VirtualPredict AI</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  color:white;
  background:linear-gradient(135deg,#050000,#300000,#080000);
  min-height:100vh;
}

.container{
  width:94%;
  max-width:650px;
  margin:auto;
  padding:35px 0;
}

h1{
  text-align:center;
  color:#ff1111;
  font-size:38px;
  margin:10px 0;
}

.subtitle{
  text-align:center;
  color:#ddd;
  font-size:19px;
  margin-bottom:30px;
}

.box{
  background:#100000;
  border:2px solid #a00000;
  border-radius:28px;
  padding:24px;
}

.title{
  display:block;
  font-size:21px;
  font-weight:bold;
  margin-bottom:12px;
}

#account{
  width:100%;
  padding:17px;
  border:2px solid #550000;
  border-radius:18px;
  background:#050505;
  color:white;
  font-size:19px;
  outline:none;
}

.note{
  color:#888;
  font-size:14px;
  line-height:1.4;
  margin:10px 0 22px;
}

.buttons{
  display:flex;
  gap:12px;
}

.upload{
  flex:1;
  padding:19px 8px;
  border:0;
  border-radius:18px;
  background:#ed0000;
  color:white;
  font-size:19px;
  font-weight:bold;
}

.upload:active{
  transform:scale(.97);
}

input[type=file]{
  display:none;
}

#selected{
  display:none;
  color:#00ff66;
  text-align:center;
  font-weight:bold;
  margin:18px 0 10px;
}

#previewBox{
  display:none;
  text-align:center;
  margin:10px 0 20px;
}

#preview{
  width:100%;
  max-height:500px;
  object-fit:contain;
  border:2px solid #e00000;
  border-radius:15px;
  background:#000;
}

#analyze{
  width:100%;
  padding:20px;
  border:0;
  border-radius:18px;
  background:#555;
  color:#aaa;
  font-size:21px;
  font-weight:bold;
}

#analyze.ready{
  background:#f00000;
  color:white;
}

#status{
  text-align:center;
  margin-top:15px;
  color:#ddd;
}

#error{
  text-align:center;
  color:#ff4444;
  font-weight:bold;
  margin-top:12px;
}

#results{
  margin-top:25px;
}

.card{
  background:#190000;
  border:1px solid #850000;
  border-radius:18px;
  padding:18px;
  margin-bottom:15px;
}

.card h2{
  color:#ff3030;
  font-size:20px;
  margin-top:0;
}

.prediction{
  background:#280000;
  border-left:5px solid red;
  padding:13px;
  border-radius:8px;
  margin:12px 0;
}

.line{
  color:#ccc;
  line-height:1.6;
}
</style>
</head>

<body>

<div class="container">

<h1>⚡ VirtualPredict AI</h1>

<div class="subtitle">
1X2 Virtual Game Analysis
</div>

<div class="box">

<label class="title">
📱 SportyBet Account Number
</label>

<input
id="account"
type="tel"
inputmode="numeric"
placeholder="Enter account number"
autocomplete="off"
>

<div class="note">
Your account number is not sent to the AI.
Never enter your password or PIN.
</div>

<div class="buttons">

<button
class="upload"
type="button"
onclick="openGallery()">
🖼️ Gallery
</button>

<button
class="upload"
type="button"
onclick="openCamera()">
📷 Camera
</button>

</div>

<input
id="gallery"
type="file"
accept="image/*"
>

<input
id="camera"
type="file"
accept="image/*"
capture="environment"
>

<div id="selected">
✅ Screenshot selected
</div>

<div id="previewBox">
<img id="preview" alt="Selected screenshot">
</div>

<button
id="analyze"
type="button"
disabled
onclick="analyzeImage()">
🔍 Analyze All Games
</button>

<div id="status"></div>

<div id="error"></div>

<div id="results"></div>

</div>
</div>


<script>

let selectedFile = null;

const gallery =
document.getElementById("gallery");

const camera =
document.getElementById("camera");

const preview =
document.getElementById("preview");

const previewBox =
document.getElementById("previewBox");

const selected =
document.getElementById("selected");

const analyze =
document.getElementById("analyze");

const status =
document.getElementById("status");

const errorBox =
document.getElementById("error");

const results =
document.getElementById("results");


function openGallery(){

  gallery.value = "";

  gallery.click();

}


function openCamera(){

  camera.value = "";

  camera.click();

}


gallery.addEventListener("change",function(){

  loadImage(this.files);

});


camera.addEventListener("change",function(){

  loadImage(this.files);

});


function loadImage(files){

  errorBox.textContent = "";

  if(!files || files.length === 0){
    return;
  }

  const file = files[0];

  if(!file.type.startsWith("image/")){

    errorBox.textContent =
    "❌ Please select an image.";

    return;
  }

  selectedFile = file;

  const reader = new FileReader();

  reader.onload = function(e){

    preview.src = e.target.result;

    previewBox.style.display = "block";

    selected.style.display = "block";

    analyze.disabled = false;

    analyze.classList.add("ready");

    status.textContent =
    "Screenshot ready for analysis.";

    results.innerHTML = "";

  };

  reader.onerror = function(){

    errorBox.textContent =
    "❌ Could not load the image.";

  };

  reader.readAsDataURL(file);

}


async function analyzeImage(){

  if(!selectedFile){

    errorBox.textContent =
    "❌ Please select a screenshot first.";

    return;
  }

  analyze.disabled = true;

  analyze.classList.remove("ready");

  analyze.textContent =
  "⏳ Analyzing All Games...";

  status.textContent =
  "AI is analyzing your screenshot...";

  errorBox.textContent = "";

  results.innerHTML = "";

  try{

    const formData = new FormData();

    formData.append("image",selectedFile);

    const response =
    await fetch("/api/analyze",{
      method:"POST",
      body:formData
    });

    const data =
    await response.json();

    if(!response.ok){

      throw new Error(
        data.error || "Analysis failed."
      );

    }

    if(
      !data.matches ||
      !Array.isArray(data.matches) ||
      data.matches.length === 0
    ){

      throw new Error(
        "No readable matches were found."
      );

    }

    status.textContent =
    "✅ Analysis complete — " +
    data.matches.length +
    " match(es) found.";

    showResults(data.matches);

  }catch(err){

    errorBox.textContent =
    "❌ " + err.message;

    status.textContent = "";

  }

  analyze.disabled = false;

  analyze.classList.add("ready");

  analyze.textContent =
  "🔍 Analyze All Games";

}


function showResults(matches){

  results.innerHTML = "";

  matches.forEach(function(match,index){

    const card =
    document.createElement("div");

    card.className = "card";

    card.innerHTML = `

      <h2>
      ${index + 1}. ${safe(match.game)}
      </h2>

      <div class="line">
      <b>1X2 Odds:</b>
      ${safe(match.odds || "Not available")}
      </div>

      <div class="prediction">
      <b>🤖 AI Prediction:</b><br>
      ${safe(match.prediction || "No estimate")}
      </div>

      <div class="line">
      <b>Alternative:</b>
      ${safe(match.alternative || "Not available")}
      </div>

      <div class="line">
      <b>Confidence:</b>
      ${safe(match.confidence || "Medium")}
      </div>

      <div class="line">
      <b>Risk:</b>
      ${safe(match.risk || "Medium")}
      </div>

      <div class="line">
      <b>Analysis:</b>
      ${safe(match.analysis || "Estimate based on visible information.")}
      </div>

    `;

    results.appendChild(card);

  });

}


function safe(value){

  return String(value)
  .replace(/&/g,"&amp;")
  .replace(/</g,"&lt;")
  .replace(/>/g,"&gt;")
  .replace(/"/g,"&quot;")
  .replace(/'/g,"&#039;");

}

</script>

</body>
</html>
